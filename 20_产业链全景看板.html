<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南浔产业链全景看板 · 撮合与招商</title>
<style>
  :root{--bg:#0b1220;--bg2:#0f172a;--card:#151f35;--card2:#1a2440;--ink:#e8eef7;--sub:#94a3b8;--line:#26334f;
        --brand:#60a5fa;--brand2:#a78bfa;--amber:#fbbf24;--green:#34d399;--red:#f87171;--radius:14px;}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:linear-gradient(180deg,var(--bg2),var(--bg) 500px);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .top{background:linear-gradient(135deg,#13203a,#1b1a3a);border-bottom:1px solid var(--line);padding:26px 28px 20px;position:sticky;top:0;z-index:50}
  .top h1{font-size:26px;letter-spacing:1px}
  .top .sub{color:var(--sub);font-size:13px;margin-top:4px}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;min-width:120px}
  .kpi b{font-size:22px;display:block}
  .kpi span{font-size:12px;color:var(--sub)}
  .kpi.g b{color:var(--green)} .kpi.a b{color:var(--amber)} .kpi.p b{color:var(--brand2)}
  .layout{display:flex;gap:0;max-width:1560px;margin:0 auto}
  nav{width:228px;flex-shrink:0;position:sticky;top:208px;align-self:flex-start;padding:20px 8px 30px 20px;border-right:1px solid var(--line);height:calc(100vh - 220px);overflow-y:auto}
  nav .grp{font-size:11px;color:var(--sub);letter-spacing:1.5px;margin:14px 0 8px;padding-left:10px}
  nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:9px;color:var(--sub);text-decoration:none;font-size:13px;margin-bottom:2px;transition:all .12s}
  nav a:hover{background:var(--card);color:var(--ink)}
  nav a.on{background:linear-gradient(90deg,rgba(96,165,250,.18),transparent);color:var(--brand);font-weight:600;border-left:2px solid var(--brand)}
  nav a em{font-style:normal;font-size:11px;color:var(--sub)}
  nav a.on em{color:var(--brand)}
  main{flex:1;padding:26px 30px 80px;min-width:0}
  .chain{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:26px;overflow:hidden;scroll-margin-top:205px}
  .chain-head{display:flex;align-items:baseline;gap:14px;padding:18px 24px 12px;border-bottom:1px solid rgba(38,51,79,.5)}
  .chain-head .no{font-size:12px;color:var(--brand);letter-spacing:2px;font-weight:700}
  .chain-head h2{font-size:21px}
  .chain-head .cnt{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
  .chain-body{padding:18px 24px 24px}
  .kv{display:grid;grid-template-columns:100px 1fr;gap:6px 14px;font-size:13px;margin-bottom:14px}
  .kv .k{color:var(--sub);text-align:right}
  .kv .v{color:var(--ink)}
  .kv .v b{color:var(--amber)}
  h4{font-size:13px;margin:18px 0 10px;color:var(--sub);letter-spacing:1px;font-weight:600}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:1100px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px}
  .panel h5{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .panel ul{list-style:none}
  .panel li{padding:6px 0 6px 18px;position:relative;color:var(--sub);border-bottom:1px dashed rgba(38,51,79,.4);font-size:12.5px}
  .panel li:last-child{border-bottom:none}
  .panel li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%}
  .panel.gap li::before{background:var(--red)}
  .panel.gap li b{color:var(--ink);font-weight:600}
  .panel.match li::before{background:var(--green)}
  .panel.match li b{color:var(--ink)}
  .panel.match .sup{color:var(--green)} .panel.match .dem{color:var(--amber)}
  .panel.cap li::before{background:var(--brand2)}
  .lv-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .lv-区内{background:rgba(52,211,153,.16);color:var(--green)}
  .lv-行业级{background:rgba(167,139,250,.16);color:var(--brand2)}
  .lv-强线索{background:rgba(251,191,36,.16);color:var(--amber)}
  .lv-推测{background:rgba(148,163,184,.16);color:var(--sub)}
  .chain-struct{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--sub);background:#0d1526;border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;line-height:1.8;margin-bottom:8px}
  .note-box{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.28);border-radius:12px;padding:12px 16px;font-size:12.5px;color:var(--sub);margin-top:14px}
  .note-box b{color:var(--amber)}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:30px 0 10px}
  .toTop{position:fixed;right:26px;bottom:26px;background:var(--brand);color:#fff;border:none;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:13px;opacity:.9;z-index:99}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2c3a55;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
  
    .watermark{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:22px 36px;margin-top:10px;background:linear-gradient(180deg,rgba(15,23,42,.55),rgba(15,23,42,.85));border-top:1px solid var(--line)}
    .watermark img{height:34px;display:block;opacity:.92;filter:drop-shadow(0 0 4px rgba(0,0,0,.4))}
    .wmark-left{display:flex;align-items:center;gap:14px}
    .brand-stack .brand-name{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.5px}
    .brand-stack .brand-line{font-size:11px;color:var(--brand);margin-top:1px}
    .wmark-center{flex:1;text-align:center;min-width:0}
    .wmark-center .cc{font-size:12.5px;color:var(--ink);font-weight:500}
    .wmark-center .meta{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.55}
    .wmark-right{text-align:right}
    .wmark-right .by{font-size:10.5px;color:var(--sub);letter-spacing:1.5px}
    .wmark-right .by-name{font-size:12.5px;color:var(--brand);font-weight:600;margin-top:2px}
    @media(max-width:760px){.watermark{flex-direction:col;text-align:center;gap:14px}.wmark-right{text-align:center}}
</style>
</head>

<div id="pwlock" style="position:fixed;inset:0;background:#0b1220;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <div style="text-align:center;max-width:340px;padding:40px 36px;background:#151f35;border:1px solid #26334f;border-radius:16px">
    <div style="font-size:20px;color:#e8eef7;margin-bottom:6px;font-weight:700">南浔产业链看板</div>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:22px">请输入访问密码</div>
    <input id="pwinput" type="password" placeholder="密码" style="width:100%;box-sizing:border-box;padding:11px 14px;border-radius:10px;border:1px solid #26334f;background:#0d1526;color:#e8eef7;font-size:15px;text-align:center;outline:none" />
    <div id="pwerr" style="height:18px;font-size:12px;color:#f87171;margin-top:8px"></div>
    <button onclick="tryPw()" style="width:100%;margin-top:6px;padding:11px;border:none;border-radius:10px;background:#60a5fa;color:#0b1220;font-size:15px;font-weight:700;cursor:pointer">进入</button>
  </div>
</div>
<script>
function tryPw(){
  var v=document.getElementById('pwinput').value;
  if(v==='996688'){
    sessionStorage.setItem('nx_pw','1');
    var l=document.getElementById('pwlock'); if(l) l.remove();
  } else {
    document.getElementById('pwerr').textContent='密码错误';
    document.getElementById('pwinput').value=''; document.getElementById('pwinput').focus();
  }
}
document.getElementById('pwinput').addEventListener('keydown',function(e){ if(e.key==='Enter') tryPw(); });
(function(){ if(sessionStorage.getItem('nx_pw')==='1'){ var l=document.getElementById('pwlock'); if(l) l.remove(); } else { document.getElementById('pwinput').focus(); } })();
</script>

  const no = parseInt(c.no);
  html += `<section class="chain" id="chain-${no}">
    <div class="chain-head" style="border-left:4px solid ${COLOR[no]}">
      <span class="no">CHAIN ${c.no}</span>
      <h2>${c.name}</h2>
      <span class="cnt">${c.companies.length} 家会员</span>
    </div>
    <div class="chain-body">
      <div class="kv">
        <div class="k">链主/龙头</div><div class="v">${c.leader || '—'}</div>
        <div class="k">资本亮点</div><div class="v">${c.capital || '—'}</div>
        <div class="k">本链企业</div><div class="v"><div class="pills">${c.companies.map(n=>`<span class="pill">${n}</span>`).join('')}</div></div>
      </div>
      <h4>产业链结构（上游 → 中游 → 下游）</h4>
      <div class="chain-struct">${stripStruct(c.structure)}</div>
      <div class="grid2">
        <div class="panel match">
          <h5 style="color:var(--green)">· 区内撮合候选（${c.matches.length}）</h5>
          ${c.matches.length ? `<ul>${c.matches.map(m=>`<li><span class="sup">${m.sup}</span> → <span class="dem">${m.dem}</span>${LV(m.lv)}<br><span style="color:var(--sub);font-size:11.5px">${m.prod}｜${m.src}</span></li>`).join('')}</ul>` : '<div style="color:var(--sub);font-size:12.5px">暂无私域配对（撮合以其他链为主）</div>'}
        </div>
        <div class="panel gap">
          <h5 style="color:var(--red)">· 招商断点 / 缺口（沿链找断点）</h5>
          <ul>${c.gaps.map(g=>`<li>${g}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="note-box"><b>模型提示：</b>需求侧企业同时是供给侧 —— 上表撮合均为链上"一跳"；完整协同 = 沿链把多跳连起来（如 ${c.name} 的下游再指向区属平台/出口），并用会员「买入侧」填报补齐（见 19 号采集表）。</div>
    </div>
  </section>`;
});
document.getElementById('main').innerHTML = html;

let nav = `<div class="grp">联动视图</div>
  <a href="21_跨链联动视图.html" style="color:var(--brand);font-weight:600">⇄ 跨链联动图谱</a>
  <div class="grp">14 条制造链（点击跳转）</div>`;
DATA.chains.forEach(c=>{
  nav += `<a href="#chain-${parseInt(c.no)}" onclick="return go(this,'chain-${parseInt(c.no)}')"><span>${c.no.slice(1)}. ${c.name}</span><em>${c.companies.length}家</em></a>`;
});
document.getElementById('nav').innerHTML = nav;
function go(el,id){
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('on'));
  el.classList.add('on');
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
  return false;
}
window.addEventListener('scroll',()=>{
  const topH = document.querySelector('.top').offsetHeight;
  let cur='';
  document.querySelectorAll('.chain').forEach(s=>{if(window.scrollY + topH + 40 >= s.offsetTop)cur=s.id;});
  document.querySelectorAll('nav a').forEach(a=>{
    a.classList.toggle('on', a.getAttribute('href')===('#'+cur));
  });
});
</script>
</body>
</html>
